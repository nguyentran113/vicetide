<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vicetide — Port Solano</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1210; }
  body { font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; color: #fff7ea; }
  canvas { display: block; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #wallet {
    position: absolute; top: 18px; right: 22px; text-align: right;
    text-shadow: 0 2px 8px rgba(0,0,0,.55);
  }
  #money { font-size: 30px; font-weight: 800; letter-spacing: .5px; color: #8be26b; }
  #stars { font-size: 21px; color: #ffd23e; letter-spacing: 3px; margin-top: 2px; }
  #objective {
    position: absolute; top: 18px; left: 22px; max-width: 430px;
    background: rgba(16, 22, 28, .58); border-left: 4px solid #ffd23e;
    padding: 10px 14px; border-radius: 0 10px 10px 0;
    font-size: 15.5px; line-height: 1.35;
  }
  #objective::before {
    content: "OBJECTIVE"; display: block; font-size: 10px; letter-spacing: 2.5px;
    color: #ffd23e; margin-bottom: 3px; font-weight: 700;
  }
  #speed {
    position: absolute; right: 26px; bottom: 210px; font-size: 27px; font-weight: 800;
    text-shadow: 0 2px 8px rgba(0,0,0,.6); font-variant-numeric: tabular-nums;
  }
  #minimap {
    position: absolute; right: 22px; bottom: 22px; width: 176px; height: 176px;
    border-radius: 50%; border: 3px solid rgba(255,255,255,.35);
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  #bustwrap {
    position: absolute; left: 50%; bottom: 15%; transform: translateX(-50%);
    width: 300px; height: 10px; background: rgba(0,0,0,.45); border-radius: 6px; overflow: hidden;
  }
  #bustfill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff5f45, #c81e1e); transition: width .12s linear; }
  #toast {
    position: fixed; left: 50%; top: 13%; transform: translate(-50%, -8px);
    background: rgba(14, 20, 26, .82); color: #ffe9b8; padding: 12px 22px; border-radius: 12px;
    font-size: 17px; font-weight: 600; opacity: 0; pointer-events: none; z-index: 8;
    transition: opacity .25s ease, transform .25s ease; max-width: 80vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #cross {
    position: fixed; left: 50%; top: 50%; width: 22px; height: 22px;
    transform: translate(-50%, -50%); z-index: 6; pointer-events: none;
  }
  #cross::before, #cross::after {
    content: ""; position: absolute; background: rgba(255,255,255,.9);
    box-shadow: 0 0 4px rgba(0,0,0,.8);
  }
  #cross::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #cross::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }

  /* ---------- overlays ---------- */
  .veil {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }
  #titleCard {
    background: linear-gradient(180deg, rgba(26,16,24,.18) 0%, rgba(26,16,24,.55) 78%);
  }
  #card {
    text-align: center; padding: 44px 58px 38px; border-radius: 22px;
    background: rgba(20, 14, 26, .55); backdrop-filter: blur(7px);
    border: 1px solid rgba(255, 210, 140, .35);
    box-shadow: 0 24px 70px rgba(0,0,0,.5);
  }
  #card h1 {
    font-family: "Arial Black", "Avenir Next", sans-serif;
    font-size: 84px; letter-spacing: 6px; line-height: 1;
    background: linear-gradient(180deg, #ffe9a8 15%, #ff8c42 55%, #e5484d 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 rgba(60,10,40,.55));
  }
  #card .sub {
    margin-top: 8px; font-size: 16px; letter-spacing: 4.5px; color: #ffd9a0; font-weight: 600;
  }
  #card .blurb { margin: 16px auto 24px; max-width: 430px; font-size: 14.5px; color: #f3e6cf; line-height: 1.5; }
  .btnrow { display: flex; gap: 14px; justify-content: center; }
  button {
    font: inherit; font-weight: 800; letter-spacing: 1.5px; cursor: pointer;
    color: #2a1503; background: linear-gradient(180deg, #ffd23e, #ff9f2e);
    border: none; border-radius: 999px; padding: 13px 30px; font-size: 16px;
    box-shadow: 0 6px 0 #a34d12, 0 12px 26px rgba(0,0,0,.4);
  }
  button:active { transform: translateY(3px); box-shadow: 0 3px 0 #a34d12; }
  #btnContinue { background: linear-gradient(180deg, #a8e063, #56ab2f); color: #0e2a05; box-shadow: 0 6px 0 #2f6414, 0 12px 26px rgba(0,0,0,.4); }
  #card .hint { margin-top: 22px; font-size: 12.5px; color: rgba(255,240,214,.75); letter-spacing: .4px; }
  #paused, #busted {
    background: rgba(10, 8, 14, .45); z-index: 11;
    font-family: "Arial Black", sans-serif; font-size: 54px; letter-spacing: 8px;
  }
  #busted { color: #ff5f45; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>

<div id="hud" hidden>
  <div id="objective"></div>
  <div id="wallet">
    <div id="money">$150</div>
    <div id="stars">☆☆☆☆☆</div>
  </div>
  <div id="speed"></div>
  <div id="bustwrap"><div id="bustfill"></div></div>
  <canvas id="minimap" width="176" height="176"></canvas>
</div>

<div id="cross" hidden></div>
<div id="toast"></div>

<div id="titleCard" class="veil">
  <div id="card">
    <h1>VICETIDE</h1>
    <div class="sub">PORT SOLANO</div>
    <p class="blurb">One washed-up driver, one sun-bleached city, and Marisol Vega's
    list of favours. Run the jobs, dodge the law, keep the change.</p>
    <div class="btnrow">
      <button id="btnNew">NEW GAME</button>
      <button id="btnContinue">CONTINUE</button>
    </div>
    <p class="hint">WASD move &nbsp;·&nbsp; E enter / exit car &nbsp;·&nbsp; Shift sprint &nbsp;·&nbsp;
    click to aim, mouse to shoot &nbsp;·&nbsp; P pause</p>
  </div>
</div>

<div id="paused" class="veil" hidden>PAUSED</div>
<div id="busted" class="veil" hidden>BUSTED</div>

<script type="module" src="./src/boot.js"></script>
</body>
</html>
