<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VICETIDE — Port Solano</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #1a0f1e;
    font-family: Verdana, Geneva, sans-serif;
    color: #fff;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .panel {
    position: fixed;
    background: rgba(10, 8, 24, .82);
    border: 2px solid #ffb347;
    border-radius: 10px;
    padding: 10px 14px;
    box-sizing: border-box;
  }
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  #minimapWrap {
    position: fixed; left: 14px; bottom: 14px;
    width: 190px; height: 190px;
    border: 3px solid #ffb347; border-radius: 8px;
    overflow: hidden; background: #123;
  }
  #minimap { width: 190px; height: 190px; }
  #topbar { position: fixed; top: 12px; right: 14px; text-align: right; text-shadow: 2px 2px 3px #000; }
  #money { font-size: 24px; font-weight: bold; color: #7dff8a; }
  #stars { font-size: 26px; color: #ffd23f; letter-spacing: 3px; min-height: 32px; }
  #healthWrap { position: fixed; right: 14px; top: 96px; width: 190px; }
  #healthBarBg { background: #333; border: 2px solid #fff; height: 16px; border-radius: 8px; overflow: hidden; }
  #healthBar { background: #e33; height: 100%; width: 100%; }
  #objective {
    position: fixed; top: 12px; left: 50%;
    transform: translateX(-50%);
    max-width: 620px; text-align: center; font-size: 15px;
  }
  #speedo {
    position: fixed; right: 16px; bottom: 16px;
    font-size: 34px; font-weight: bold;
    text-shadow: 2px 2px 3px #000; display: none;
  }
  #toast {
    position: fixed; bottom: 230px; left: 50%;
    transform: translateX(-50%);
    font-size: 19px; color: #ffe27a;
    text-shadow: 2px 2px 3px #000; text-align: center;
  }
  #screen {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(255, 120, 60, .25), rgba(10, 5, 30, .88));
  }
  #card {
    max-width: 680px; text-align: center;
    padding: 28px 34px;
    background: rgba(12, 8, 28, .9);
    border: 3px solid #ff5e8a; border-radius: 16px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .06);
    backdrop-filter: blur(3px);
  }
  #card h1 { font-size: 58px; margin: 0; color: #ffd23f; letter-spacing: 4px; text-shadow: 3px 3px 0 #ff5e8a; }
  #card h2 { color: #7ae7ff; margin: 6px; }
  button {
    pointer-events: auto;
    background: #ff5e8a; color: #fff;
    border: 2px solid #fff; border-radius: 8px;
    font-size: 18px; padding: 10px 22px; margin: 6px;
    cursor: pointer; font-weight: bold;
  }
  .keys { font-size: 13px; line-height: 1.7; color: #ddd; text-align: left; display: inline-block; }
  #cross {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 22px; display: none;
    text-shadow: 1px 1px 2px #000;
  }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="objective" class="panel"></div>
  <div id="topbar"><div id="stars"></div><div id="money">$0</div></div>
  <div id="healthWrap">
    <div style="font-size:12px">HEALTH</div>
    <div id="healthBarBg"><div id="healthBar"></div></div>
  </div>
  <div id="minimapWrap"><canvas id="minimap" width="190" height="190"></canvas></div>
  <div id="speedo">0 km/h</div>
  <div id="toast"></div>
  <div id="cross">+</div>
</div>
<div id="screen"><div id="card"></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
